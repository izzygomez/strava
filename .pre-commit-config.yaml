repos:
  # 1. External hooks (pre-commit's built-in collection)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0 # Specify the latest stable version
    hooks:
      - id: trailing-whitespace # Removes trailing whitespace
      - id: end-of-file-fixer # Ensures files end with a single newline
      - id: check-yaml # Validates YAML syntax
      - id: check-json # Validates JSON syntax
      - id: check-added-large-files # Prevents large files from being added
      - id: check-executables-have-shebangs # Ensure executables have shebangs
      - id: check-shebang-scripts-are-executable # Ensure shebang scripts are executable

  # 2. Ruff for linting and formatting (replaces Black, isort, and flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7 # Specify the latest stable version
    hooks:
      - id: ruff # Linter (replaces flake8)
        args: [--fix] # Auto-fix issues when possible
      - id: ruff-format # Formatter (replaces Black + isort)

  # 3. Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2 # Specify the latest stable version
    hooks:
      - id: shfmt # Format shell scripts
        args: [-w, -s, -i, "4"] # Write changes, simplify code, 4-space indent

  # 4. Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1 # Specify the latest stable version
    hooks:
      - id: shellcheck # Lint shell scripts for common issues
